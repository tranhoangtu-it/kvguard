[package]
name = "kvguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Local proxy & TUI that catches 1-token prompt/KV cache prefix misses and auto-heals requests for Anthropic, OpenAI, llama.cpp and Ollama."
readme = "README.md"
keywords = ["llm", "prompt-caching", "kv-cache", "proxy", "tui"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
glob = "0.3.4"
minijinja = { version = "3.0.5", features = ["json", "loop_controls", "serde"] }
minijinja-contrib = { version = "3.0.5", features = ["pycompat"] }
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tiktoken-rs = "0.12.1"
tokio = { version = "1.54.1", features = ["full"] }
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
wiremock = "0.6.5"
