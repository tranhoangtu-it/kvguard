name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: false }
          - { target: aarch64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build (cross)
        if: matrix.cross
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"

      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="kvguard-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "dist/$name.zip" "./$dir/kvguard.exe" README.md LICENSE-MIT LICENSE-APACHE
            asset="dist/$name.zip"
          else
            tar -czf "dist/$name.tar.gz" -C "$dir" kvguard -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE
            asset="dist/$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" | sed 's#dist/##' > "$asset.sha256"
          else
            shasum -a 256 "$asset" | sed 's#dist/##' > "$asset.sha256"
          fi

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/kvguard-*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true

  # Registry publishing uses OIDC trusted publishing (no tokens). Enable each job by
  # configuring the trusted publisher on the registry and setting the repo variable.
  npm:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Version matches tag
        working-directory: wrappers/npm
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish
        working-directory: wrappers/npm
        run: npm publish --provenance --access public

  pypi:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Version matches tag
        working-directory: wrappers/pypi
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml
      - name: Build
        working-directory: wrappers/pypi
        run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: wrappers/pypi/dist

  # Homebrew: renders Formula/kvguard.rb from the release checksums, installs it on a real
  # macOS runner, then pushes it to <owner>/homebrew-tap. Enable with the HOMEBREW_TAP_TOKEN
  # secret (contents: write on the tap repo) and PUBLISH_HOMEBREW=true.
  homebrew:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_HOMEBREW == 'true'
    runs-on: macos-latest
    steps:
      - name: Render formula
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/$TAG"
          sha() { curl -fsSL "$base/kvguard-$TAG-$1.tar.gz.sha256" | cut -d' ' -f1; }
          mkdir -p tap/Formula
          cat > tap/Formula/kvguard.rb <<EOF
          class Kvguard < Formula
            desc "Local proxy & TUI that catches prompt/KV cache prefix misses"
            homepage "https://github.com/$REPO"
            version "${TAG#v}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "$base/kvguard-$TAG-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "$base/kvguard-$TAG-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "$base/kvguard-$TAG-aarch64-unknown-linux-musl.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-musl)"
              end
              on_intel do
                url "$base/kvguard-$TAG-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-musl)"
              end
            end

            def install
              bin.install "kvguard"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/kvguard --version")
            end
          end
          EOF
          cat tap/Formula/kvguard.rb

      - name: Verify the formula installs
        run: |
          set -euo pipefail
          brew tap-new --no-git kvguard/verify
          cp tap/Formula/kvguard.rb "$(brew --repository kvguard/verify)/Formula/"
          brew install kvguard/verify/kvguard
          kvguard --version
          brew test kvguard/verify/kvguard

      - name: Push to the tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/${OWNER}/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Formula
          cp tap/Formula/kvguard.rb tap-repo/Formula/
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kvguard.rb
          git commit -m "kvguard ${TAG}" || { echo "formula unchanged"; exit 0; }
          git push
