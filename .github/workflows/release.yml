name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: false }
          - { target: aarch64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (cross)
        if: matrix.cross
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"

      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="kvguard-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "dist/$name.zip" "./$dir/kvguard.exe" README.md LICENSE-MIT LICENSE-APACHE
            asset="dist/$name.zip"
          else
            tar -czf "dist/$name.tar.gz" -C "$dir" kvguard -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE
            asset="dist/$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" | sed 's#dist/##' > "$asset.sha256"
          else
            shasum -a 256 "$asset" | sed 's#dist/##' > "$asset.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Registry publishing uses OIDC trusted publishing (no tokens). Enable each job by
  # configuring the trusted publisher on the registry and setting the repo variable.
  npm:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Version matches tag
        working-directory: wrappers/npm
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish
        working-directory: wrappers/npm
        run: npm publish --provenance --access public

  pypi:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Version matches tag
        working-directory: wrappers/pypi
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml
      - name: Build
        working-directory: wrappers/pypi
        run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wrappers/pypi/dist
